<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b14"><title>Aither Gaming</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b14;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#game{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000}#bar{position:fixed;z-index:20;left:12px;right:12px;top:12px;display:flex;gap:8px;align-items:center;padding:8px;border-radius:15px;background:rgba(8,11,20,.84);backdrop-filter:blur(14px);box-shadow:0 8px 30px rgba(0,0,0,.35);transition:opacity .2s}#bar button{border:1px solid #303952;border-radius:10px;padding:9px 13px;background:#fff;color:#080b14;font-weight:800;cursor:pointer}#title{flex:1;min-width:0;color:#fff;font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#status{position:fixed;z-index:30;inset:0;display:grid;place-items:center;color:#dce4ff;font-weight:700;font-size:16px;padding:24px;text-align:center;background:#080b14}.hidden{display:none!important}@media(max-width:600px){#bar{left:7px;right:7px;top:7px;padding:6px}#bar button{padding:8px 9px;font-size:12px}}
</style>
</head>
<body>
<div id="status">Loading game…</div>
<div id="bar"><button id="back">← Games</button><span id="title"></span><button id="fullscreen">⛶ Fullscreen</button></div>
<iframe id="game" title="Aither Gaming game" allow="fullscreen; autoplay; gamepad; pointer-lock; clipboard-read; clipboard-write" allowfullscreen></iframe>
<script>
const frame=document.getElementById('game'),status=document.getElementById('status'),titleEl=document.getElementById('title');
const back=()=>location.href='index.html';document.getElementById('back').onclick=back;
document.getElementById('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await frame.requestFullscreen()}catch(e){try{await frame.contentWindow.document.documentElement.requestFullscreen()}catch(_){} }};
function esc(s){return String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}
const CDN='https://cdn.jsdelivr.net/gh/AitherNexus/AitherGaming@main/';
const clean=p=>String(p||'').split('/').filter(Boolean).map(encodeURIComponent).join('/');
async function load(){
 const path=new URLSearchParams(location.search).get('game');
 if(!path)throw Error('No game was selected.');
 const [main,ai]=await Promise.all([
   fetch('games.json',{cache:'no-store'}).then(r=>r.ok?r.json():[]),
   fetch('ai-games.json',{cache:'no-store'}).then(r=>r.ok?r.json():[]).catch(()=>[])
 ]);
 const all=[...main,...ai];const g=all.find(x=>x.path===path);
 if(!g)throw Error('That game is not in the Aither Gaming library.');
 titleEl.textContent=g.name||'Game';
 const dir=CDN+clean(g.path)+'/';
 const entry=g.entry||'index.html';
 const url=dir+clean(entry);
 frame.src=url;
 frame.onload=()=>{status.classList.add('hidden');};
 frame.onerror=()=>{throw Error('The game file could not be loaded from jsDelivr.');};
}
load().catch(e=>{status.innerHTML='<div><div style="font-size:24px;margin-bottom:10px">🎮 Game could not load</div><div style="font-weight:500;color:#aeb6cc">'+esc(e.message||e)+'</div><button id="retry" style="margin-top:16px;border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer">Try again</button></div>';document.getElementById('retry').onclick=()=>location.reload()});
</script>
</body></html>
