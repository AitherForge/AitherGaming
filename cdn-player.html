<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080b14">
  <title>Aither Gaming — Loading…</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b14;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#game{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000}#bar{position:fixed;z-index:20;left:12px;top:12px;display:flex;gap:8px;align-items:center;padding:8px;border-radius:14px;background:rgba(8,11,20,.82);backdrop-filter:blur(12px);box-shadow:0 8px 30px rgba(0,0,0,.3);transition:opacity .2s}#bar button{border:0;border-radius:10px;padding:9px 13px;background:#fff;color:#080b14;font-weight:700;cursor:pointer}#title{max-width:260px;color:#fff;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 5px}#status{position:fixed;inset:0;display:grid;place-items:center;color:#dce4ff;font-weight:700;font-size:16px;padding:24px;text-align:center}#bar.hidden{opacity:0;pointer-events:none}
  </style>
</head>
<body>
  <div id="status">Loading game from jsDelivr…</div>
  <div id="bar"><button id="back">← Aither Gaming</button><span id="title"></span></div>
  <iframe id="game" title="Aither Gaming game" allow="fullscreen; autoplay; gamepad; pointer-lock" allowfullscreen></iframe>
  <script>
    const CDN='https://cdn.jsdelivr.net/gh/AitherNexus/AitherGaming@main/';
    const statusEl=document.getElementById('status'),frame=document.getElementById('game'),titleEl=document.getElementById('title');
    const back=()=>{location.href='index.html'};
    document.getElementById('back').addEventListener('click',back);
    const preferred=['index.html','game.html','main.html','play.html','start.html','launcher.html','menu.html','home.html'];
    const cleanPath=p=>p.split('/').filter(Boolean).map(encodeURIComponent).join('/');
    const dirUrl=path=>CDN+cleanPath(path).replace(/\/$/,'')+'/';
    const fileUrl=(dir,file)=>dir+file.split('/').map(encodeURIComponent).join('/');
    async function listing(dir){
      const r=await fetch(dir,{cache:'no-store'});
      if(!r.ok)throw new Error('CDN directory unavailable');
      return new DOMParser().parseFromString(await r.text(),'text/html');
    }
    async function findEntry(dir,depth=0){
      const doc=await listing(dir);
      const links=[...doc.querySelectorAll('a[href]')].map(a=>a.getAttribute('href')).filter(Boolean);
      const files=links.filter(h=>/\.html?$/i.test(h) && !h.includes('?'));
      for(const name of preferred){const hit=files.find(h=>decodeURIComponent(h).replace(/^.*\//,'').toLowerCase()===name);if(hit)return decodeURIComponent(hit).replace(/^\.\//,'')}
      if(files.length)return decodeURIComponent(files[0]).replace(/^\.\//,'');
      if(depth>=2)return null;
      const dirs=links.filter(h=>h.endsWith('/') && h!=='../' && !h.startsWith('http'));
      for(const child of dirs){const result=await findEntry(new URL(child,dir).href,depth+1);if(result)return child+result}
      return null;
    }
    async function getGame(){
      const path=new URLSearchParams(location.search).get('game');
      if(!path)throw new Error('No game was selected.');
      const [main,ai]=await Promise.all([
        fetch('games.json',{cache:'no-store'}).then(r=>r.ok?r.json():[]),
        fetch('ai-games.json',{cache:'no-store'}).then(r=>r.ok?r.json():[]).catch(()=>[])
      ]);
      const game=[...main,...ai].find(g=>g.path===path);
      if(!game)throw new Error('That game is not in the Aither Gaming library.');
      titleEl.textContent=game.name||'Game';
      const dir=dirUrl(game.path);
      let entry=game.entry||null;
      if(!entry)entry=await findEntry(dir);
      if(!entry)throw new Error('Could not find an HTML game entry file.');
      const url=fileUrl(dir,entry);
      const response=await fetch(url,{cache:'no-store'});
      if(!response.ok)throw new Error('jsDelivr could not load the game file.');
      let source=await response.text();
      const baseTag='<base href="'+dir.replace(/"/g,'&quot;')+'">';
      if(/<base\s/i.test(source))source=source.replace(/<base[^>]*>/i,baseTag);
      else if(/<head[^>]*>/i.test(source))source=source.replace(/<head[^>]*>/i,m=>m+baseTag);
      else source=baseTag+source;
      frame.srcdoc=source;
      frame.onload=()=>{statusEl.remove();};
    }
    getGame().catch(err=>{statusEl.innerHTML='<div><div style="font-size:22px;margin-bottom:10px">🎮 Game could not load</div><div style="font-weight:500;color:#aeb6cc">'+String(err.message||err).replace(/[<>]/g,'')+'</div><button id="retry" style="margin-top:16px;border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer">Try again</button></div>';document.getElementById('retry').onclick=()=>location.reload();});
  </script>
</body>
</html>
