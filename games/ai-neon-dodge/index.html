<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Neon Dodge</title><style>*{box-sizing:border-box}body{margin:0;background:#080b14;color:#fff;font:16px system-ui;text-align:center}canvas{display:block;margin:16px auto;background:#10182b;border:2px solid #56f5ff;max-width:94vw;touch-action:none}button{padding:10px 18px;border:0;border-radius:10px;font-weight:700}h1{margin:16px 0 4px}p{margin:4px}</style></head><body><h1>⚡ Neon Dodge</h1><p>Move with WASD, arrows, or touch. Survive!</p><p id=s>Score: 0</p><canvas id=c width=480 height=600></canvas><button onclick=start()>Restart</button><script>const c=document.querySelector('canvas'),x=c.getContext('2d'),s=document.querySelector('#s');let p,blocks,score,over,keys={};function start(){p={x:220,y:540,w:40,h:40};blocks=[];score=0;over=0;loop()}addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);c.addEventListener('pointermove',e=>{let r=c.getBoundingClientRect();p.x=(e.clientX-r.left)/r.width*c.width-20;p.x=Math.max(0,Math.min(440,p.x))});function loop(){if(over)return;score++;s.textContent='Score: '+score; x.clearRect(0,0,480,600);x.fillStyle='#56f5ff';x.fillRect(p.x,p.y,p.w,p.h);if(Math.random()<.045)blocks.push({x:Math.random()*440,y:-30,w:30+Math.random()*40,h:30,v:3+Math.random()*4});p.x+=((keys.d||keys.arrowright)?6:0)-((keys.a||keys.arrowleft)?6:0);p.x=Math.max(0,Math.min(440,p.x));blocks.forEach(b=>{b.y+=b.v;x.fillStyle='#ff3d81';x.fillRect(b.x,b.y,b.w,b.h);if(b.x<p.x+p.w&&b.x+b.w>p.x&&b.y<p.y+p.h&&b.y+b.h>p.y)over=1});blocks=blocks.filter(b=>b.y<620);if(over){x.fillStyle='#fff';x.font='40px system-ui';x.fillText('GAME OVER',130,300);return}requestAnimationFrame(loop)}start()</script></body></html>
