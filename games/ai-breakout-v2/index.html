<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Breakout 2.0</title><style>body{margin:0;background:#0d0b16;color:#fff;text-align:center;font:16px system-ui}canvas{display:block;margin:12px auto;max-width:94vw;background:#151126;border:2px solid #b58cff;border-radius:12px;touch-action:none}button{padding:10px 18px;border:0;border-radius:10px;font-weight:700;margin:4px}</style><h1>🧱 Breakout 2.0</h1><p id=s>Score: 0 • Best: 0 • Lives: 3 • Level: 1</p><canvas id=c width=480 height=540></canvas><button onclick=start()>Restart</button><button onclick=toggle()>Pause</button><script>const c=document.querySelector('canvas'),x=c.getContext('2d'),s=document.querySelector('#s');let p,ball,br,score,lives,paused,dead,best=+localStorage.brBest||0;function start(){p={x:205,y:505,w:70,h:12};ball={x:240,y:480,vx:3.5,vy:-4,r:8};br=[];score=0;lives=3;paused=dead=0;for(let r=0;r<5;r++)for(let q=0;q<8;q++)br.push({x:q*60+3,y:r*28+30,w:54,h:20,on:1});requestAnimationFrame(loop)}function toggle(){paused=!paused;if(!paused&&!dead)requestAnimationFrame(loop)}c.onpointermove=e=>{let r=c.getBoundingClientRect();p.x=Math.max(0,Math.min(410,(e.clientX-r.left)/r.width*480-35))};onkeydown=e=>{if(e.key==='Escape')toggle()};function loop(){if(dead||paused)return;x.clearRect(0,0,480,540);x.fillStyle='#b58cff';x.fillRect(p.x,p.y,p.w,p.h);br.forEach(b=>{if(!b.on)return;x.fillStyle='#5cf0ff';x.fillRect(b.x,b.y,b.w,b.h);if(ball.x+ball.r>b.x&&ball.x-ball.r<b.x+b.w&&ball.y+ball.r>b.y&&ball.y-ball.r<b.y+b.h){b.on=0;ball.vy*=-1;score+=10}});x.fillStyle='#ff5ca8';x.beginPath();x.arc(ball.x,ball.y,ball.r,0,7);x.fill();ball.x+=ball.vx;ball.y+=ball.vy;if(ball.x<8||ball.x>472)ball.vx*=-1;if(ball.y<8)ball.vy=Math.abs(ball.vy);if(ball.y+ball.r>p.y&&ball.y-ball.r<p.y+p.h&&ball.x>p.x&&ball.x<p.x+p.w){ball.vy=-Math.abs(ball.vy);ball.vx+=(ball.x-(p.x+p.w/2))/25}if(ball.y>550){lives--;if(lives)ball={x:240,y:480,vx:3.5,vy:-4,r:8};else dead=1}let lv=1+(score/200|0);if(!br.some(b=>b.on)){score+=50;for(let r=0;r<5;r++)for(let q=0;q<8;q++)br.push({x:q*60+3,y:r*28+30,w:54,h:20,on:1});ball.vx*=1.08;ball.vy*=1.08}best=Math.max(best,score);localStorage.brBest=best;s.textContent=`Score: ${score} • Best: ${best} • Lives: ${lives} • Level: ${lv}`;if(dead){x.fillStyle='#fff';x.font='bold 36px system-ui';x.textAlign='center';x.fillText('GAME OVER',240,280);x.textAlign='left';return}requestAnimationFrame(loop)}start()</script>
