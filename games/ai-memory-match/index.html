<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Memory Match</title><style>body{margin:0;background:#11101b;color:#fff;text-align:center;font:16px system-ui}.grid{display:grid;grid-template-columns:repeat(4,70px);gap:10px;justify-content:center;margin:20px}.card{height:70px;border:0;border-radius:12px;background:#2a2740;color:transparent;font-size:32px}.card.open{background:#7057d9;color:#fff}</style></head><body><h1>🧠 Memory Match</h1><p id=s>Moves: 0</p><div class=grid id=g></div><button onclick=start()>New Game</button><script>let vals,open=[],moves=0,lock=0;const g=document.querySelector('#g'),s=document.querySelector('#s');function start(){vals=['🍎','🍎','🚀','🚀','🐸','🐸','⭐','⭐','🎲','🎲','👾','👾','🔥','🔥','💎','💎'].sort(()=>Math.random()-.5);open=[];moves=0;g.innerHTML=vals.map((v,i)=>`<button class=card data-i=${i}>?</button>`).join('');g.onclick=e=>{let c=e.target;if(!c.matches('.card')||lock||c.classList.contains('open'))return;c.classList.add('open');c.textContent=vals[c.dataset.i];open.push(c);if(open.length==2){moves++;s.textContent='Moves: '+moves;lock=1;if(open[0].textContent!==open[1].textContent)setTimeout(()=>{open.forEach(q=>{q.classList.remove('open');q.textContent='?'});open=[];lock=0},650);else{open=[];lock=0;if([...g.children].every(q=>q.classList.contains('open')))s.textContent='You won in '+moves+' moves!'}}}}start()</script></body></html>
