<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Color Dash</title><style>body{margin:0;background:#0f1118;color:#fff;text-align:center;font:18px system-ui}button{width:140px;height:90px;margin:7px;border:0;border-radius:18px;font-size:20px;font-weight:800}</style></head><body><h1>🎨 Color Dash</h1><p id=q>Tap the named color</p><div id=g></div><p id=s>Score: 0</p><script>const colors=['RED','BLUE','GREEN','YELLOW'];let target,score=0;function next(){target=colors[Math.random()*4|0];q.textContent='Tap '+target;g.innerHTML=colors.sort(()=>Math.random()-.5).map(v=>`<button style="background:${v.toLowerCase()}" onclick="hit('${v}')">${v}</button>`).join('')}function hit(v){if(v===target)score++;else score=Math.max(0,score-1);s.textContent='Score: '+score;next()}next()</script></body></html>
