<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Memory Match 2.0</title><style>body{margin:0;background:#11101b;color:#fff;text-align:center;font:16px system-ui}.grid{display:grid;grid-template-columns:repeat(4,min(18vw,78px));gap:9px;justify-content:center;margin:18px}.card{aspect-ratio:1;border:0;border-radius:12px;background:#2a2740;color:transparent;font-size:30px}.open{background:#7057d9;color:#fff}.match{background:#18a66a;color:#fff}button#new{padding:10px 18px;border:0;border-radius:10px;font-weight:700}</style><h1>🧠 Memory Match 2.0</h1><p id=s>Moves: 0 • Time: 0 • Best: —</p><div class=grid id=g></div><button id=new onclick=start()>New Game</button><script>const g=document.querySelector('#g'),s=document.querySelector('#s');let vals,open=[],moves=0,sec=0,done=0,t,best=+localStorage.mmBest||Infinity;function start(){clearInterval(t);let base=['🍎','🚀','🐸','⭐','🎲','👾','🔥','💎'];vals=[...base,...base].sort(()=>Math.random()-.5);open=[];moves=sec=done=0;g.innerHTML=vals.map((_,i)=>`<button class=card data-i=${i}>?</button>`).join('');t=setInterval(()=>{sec++;draw()},1000);draw()}function draw(){s.textContent=`Moves: ${moves} • Time: ${sec} • Best: ${best===Infinity?'—':best+'s'}`}g.onclick=e=>{let c=e.target;if(!c.matches('.card')||open.length==2||c.classList.contains('match')||c.classList.contains('open')||done)return;c.classList.add('open');c.textContent=vals[c.dataset.i];open.push(c);if(open.length===2){moves++;if(open[0].textContent===open[1].textContent){open.forEach(q=>q.classList.add('match'));open=[]}else setTimeout(()=>{open.forEach(q=>{q.classList.remove('open');q.textContent='?'});open=[]},600);if([...g.children].every(q=>q.classList.contains('match'))){done=1;clearInterval(t);if(sec<best){best=sec;localStorage.mmBest=best}s.textContent=`You won in ${moves} moves • ${sec}s • Best: ${best}s`}}draw()};start()</script>
