<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Snake Arena 2.0</title><style>body{margin:0;background:#07120d;color:#eaffef;text-align:center;font:16px system-ui}canvas{display:block;margin:12px auto;max-width:94vw;background:#0c1d14;border:2px solid #63ff91;border-radius:12px;image-rendering:pixelated}button{padding:10px 18px;border:0;border-radius:10px;font-weight:700;margin:4px}</style><h1>🐍 Snake Arena 2.0</h1><p id=s>Score: 0 • Best: 0 • Level: 1</p><canvas id=c width=400 height=400></canvas><button onclick=start()>Restart</button><button onclick=toggle()>Pause</button><script>const c=document.querySelector('canvas'),x=c.getContext('2d'),s=document.querySelector('#s'),N=20,Z=20;let sn,f,d,nx,sc,dead,pause,t,best=+localStorage.snBest||0;function start(){clearInterval(t);sn=[[10,10],[9,10],[8,10]];f=[15,10];d=nx=[1,0];sc=0;dead=pause=0;tick();t=setInterval(tick,110)}function toggle(){pause=!pause}onkeydown=e=>{let q={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]}[e.key];if(q&&q[0]!=-d[0]||q&&q[1]!=-d[1])nx=q;if(e.key==='Escape')toggle()};function tick(){if(dead||pause)return;d=nx;let h=[sn[0][0]+d[0],sn[0][1]+d[1]];if(h[0]<0||h[0]>=N||h[1]<0||h[1]>=N||sn.some(q=>q[0]==h[0]&&q[1]==h[1])){dead=1;draw();x.fillStyle='#fff';x.font='bold 30px system-ui';x.fillText('GAME OVER',115,205);return}sn.unshift(h);if(h[0]==f[0]&&h[1]==f[1]){sc++;do f=[Math.random()*N|0,Math.random()*N|0];while(sn.some(q=>q[0]==f[0]&&q[1]==f[1]))}else sn.pop();draw()}function draw(){x.clearRect(0,0,400,400);x.fillStyle='#ffdf57';x.fillRect(f[0]*Z,f[1]*Z,Z,Z);x.fillStyle='#63ff91';sn.forEach((q,i)=>x.fillRect(q[0]*Z+1,q[1]*Z+1,Z-2,Z-2));let lv=1+(sc/5|0);if(sc>best){best=sc;localStorage.snBest=best}s.textContent=`Score: ${sc} • Best: ${best} • Level: ${lv}`;if(lv>1)t&&clearInterval(t),t=setInterval(tick,Math.max(45,110-lv*5))}start()</script>
