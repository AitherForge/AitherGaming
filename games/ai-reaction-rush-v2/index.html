<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Reaction Rush 2.0</title><style>body{margin:0;background:#080d18;color:#fff;font:18px system-ui;text-align:center}#b{width:min(90vw,420px);height:300px;margin:25px auto;border:0;border-radius:24px;background:#26324a;color:#fff;font-size:30px;font-weight:800}button{padding:10px 18px;border:0;border-radius:10px;font-weight:700}</style><h1>⚡ Reaction Rush 2.0</h1><p>Beat the target and build a streak.</p><p id=s>Best: — • Streak: 0</p><button id=b>START</button><script>let timer,start,armed=0,streak=0,best=+localStorage.rrBest||Infinity;const b=document.querySelector('#b'),s=document.querySelector('#s');function reset(){clearTimeout(timer);armed=0;streak=0;b.textContent='START';b.style.background='#26324a';s.textContent=`Best: ${best===Infinity?'—':best.toFixed(0)+' ms'} • Streak: 0`}b.onclick=()=>{if(armed){let ms=performance.now()-start;armed=0;if(ms<120){streak=0;s.textContent='Too early! Streak reset.'}else{streak++;best=Math.min(best,ms);localStorage.rrBest=best;s.textContent=`Reaction: ${ms.toFixed(0)} ms • Best: ${best.toFixed(0)} ms • Streak: ${streak}`}b.textContent='NEXT';b.style.background='#26324a';return}b.textContent='WAIT…';b.style.background='#26324a';timer=setTimeout(()=>{armed=1;start=performance.now();b.textContent='GO!';b.style.background='#18b66a'},700+Math.random()*2300)}reset()</script>
