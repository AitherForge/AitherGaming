<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Mini Mines</title><style>body{margin:0;background:#1a1d24;color:#fff;text-align:center;font:16px system-ui}.g{display:grid;grid-template-columns:repeat(8,40px);gap:3px;justify-content:center;margin:20px}.c{width:40px;height:40px;border:0;background:#414754;color:#fff;font-weight:800}.open{background:#242832}</style></head><body><h1>💣 Mini Mines</h1><p id=s>Find 10 mines</p><div class=g id=g></div><button onclick=start()>New Game</button><script>let a,done;const g=document.querySelector('#g'),s=document.querySelector('#s');function start(){let m=[...Array(54).keys()].sort(()=>Math.random()-.5).slice(0,10);a=[...Array(64)].map((_,i)=>({m:m.includes(i),o:0,n:0}));a.forEach((v,i)=>v.n=[-9,-8,-7,-1,1,7,8,9].filter(d=>{let j=i+d;return j>=0&&j<64&&Math.abs((j%8)-(i%8))<=1}).filter(j=>a[j].m).length);draw()}function draw(){g.innerHTML=a.map((v,i)=>`<button class="c ${v.o?'open':''}" onclick=clickc(${i})>${v.o?(v.m?'💣':v.n||''):''}</button>`).join('')}function clickc(i){let v=a[i];if(v.o)return;v.o=1;if(v.m){s.textContent='Boom! Try again.';a.forEach(q=>q.o=1)}else if(a.filter(q=>q.o&&!q.m).length===54)s.textContent='You cleared the field!';draw()}start()</script></body></html>
