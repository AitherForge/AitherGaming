<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>2048</title><style>body{margin:0;background:#faf8ef;color:#776e65;text-align:center;font:18px system-ui}.grid{display:grid;grid-template-columns:repeat(4,78px);gap:8px;justify-content:center;background:#bbada0;padding:8px;border-radius:10px;margin:20px}.tile{width:78px;height:78px;border:0;border-radius:7px;background:#cdc1b4;font-size:25px;font-weight:800;color:#776e65}button{padding:10px 18px;border:0;border-radius:10px;font-weight:700}</style></head><body><h1>🔢 2048</h1><p id=s>Score: 0</p><div class=grid id=g></div><button onclick=start()>New Game</button><script>let a,score=0;const g=document.querySelector('#g'),s=document.querySelector('#s');function add(){let e=a.map((v,i)=>v?0:i).filter(i=>i!==0);if(!e.length)return;a[e[Math.random()*e.length|0]]=2}function draw(){g.innerHTML=a.map(v=>`<button class=tile>${v||''}</button>`).join('');s.textContent='Score: '+score}function move(d){let b=[...a];for(let r=0;r<4;r++){let row=d<2?a.slice(r*4,r*4+4):[a[r],a[r+4],a[r+8],a[r+12]];if(d%2)row.reverse();row=row.filter(Boolean);for(let i=0;i<row.length-1;i++)if(row[i]===row[i+1]){row[i]*=2;score+=row[i];row.splice(i+1,1)}while(row.length<4)row.push(0);if(d%2)row.reverse();if(d<2)a.splice(r*4,4,...row);else row.forEach((v,i)=>a[r+i*4]=v)}if(a.some((v,i)=>v!==b[i]))add();draw()}addEventListener('keydown',e=>({ArrowLeft:0,ArrowRight:1,ArrowUp:2,ArrowDown:3}[e.key]!==undefined)&&move({ArrowLeft:0,ArrowRight:1,ArrowUp:2,ArrowDown:3}[e.key]));function start(){a=Array(16).fill(0);score=0;add();add();draw()}start()</script></body></html>
