<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Asteroid Blaster 2.0</title><style>body{margin:0;background:#03050a;color:#fff;text-align:center;font:16px system-ui}canvas{display:block;margin:12px auto;max-width:94vw;background:#080d18;border:2px solid #fff;border-radius:12px;touch-action:none}button{padding:10px 18px;border:0;border-radius:10px;font-weight:700}</style><h1>☄️ Asteroid Blaster 2.0</h1><p id=s>Score: 0 • Best: 0 • Lives: 3 • Level: 1</p><canvas id=c width=480 height=600></canvas><button onclick=start()>Restart</button><script>const c=document.querySelector('canvas'),x=c.getContext('2d'),s=document.querySelector('#s');let ship,rocks,shots,score,lives,over,keys={},best=+localStorage.astBest||0;function start(){ship={x:220,y:540};rocks=[];shots=[];score=0;lives=3;over=0;requestAnimationFrame(loop)}onkeydown=e=>{keys[e.key.toLowerCase()]=1;if(e.code==='Space'&&!over)shots.push({x:ship.x+18,y:ship.y})};onkeyup=e=>keys[e.key.toLowerCase()]=0;c.onpointermove=e=>{let r=c.getBoundingClientRect();ship.x=Math.max(0,Math.min(444,(e.clientX-r.left)/r.width*480-18))};function loop(){if(over)return;x.clearRect(0,0,480,600);let lv=1+(score/10|0);if(keys.a||keys.arrowleft)ship.x-=6;if(keys.d||keys.arrowright)ship.x+=6;ship.x=Math.max(0,Math.min(444,ship.x));x.fillStyle='#57e6ff';x.fillRect(ship.x,ship.y,36,24);if(Math.random()<.025+lv*.003)rocks.push({x:Math.random()*450,y:-30,r:10+Math.random()*20,v:2+Math.random()*2+lv*.15});rocks.forEach(r=>{r.y+=r.v;x.fillStyle='#ff704d';x.beginPath();x.arc(r.x,r.y,r.r,0,7);x.fill();if(r.y>520&&r.x>ship.x-10&&r.x<ship.x+46){r.y=700;lives--;if(!lives)over=1}});shots.forEach(q=>{q.y-=9;x.fillStyle='#ffe65c';x.fillRect(q.x,q.y,4,12);rocks.forEach(r=>{if(Math.hypot(q.x-r.x,q.y-r.y)<r.r){r.y=700;score++}})});rocks=rocks.filter(r=>r.y<650);shots=shots.filter(q=>q.y>-20);best=Math.max(best,score);localStorage.astBest=best;s.textContent=`Score: ${score} • Best: ${best} • Lives: ${lives} • Level: ${lv}`;if(over){x.fillStyle='#fff';x.font='bold 38px system-ui';x.textAlign='center';x.fillText('SHIP DESTROYED',240,300);x.textAlign='left';return}requestAnimationFrame(loop)}start()</script>
