<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Breakout</title><style>body{margin:0;background:#0d0b16;color:#fff;text-align:center;font:16px system-ui}canvas{display:block;margin:15px auto;max-width:94vw;background:#151126;border:2px solid #b58cff;touch-action:none}button{padding:10px 18px;border:0;border-radius:10px;font-weight:700}</style></head><body><h1>🧱 Breakout</h1><p id=s>Score: 0</p><canvas id=c width=480 height=540></canvas><button onclick=start()>Restart</button><script>const c=document.querySelector('canvas'),x=c.getContext('2d'),s=document.querySelector('#s');let p,b,dx,dy,score,dead;function start(){p={x:205,y:500,w:70,h:12};b={x:240,y:350,r:8};dx=4;dy=-4;score=0;dead=0;for(let i=0;i<10;i++)b[i]=null;loop()}let bricks=[];function loop(){x.clearRect(0,0,480,540);if(dead)return; x.fillStyle='#b58cff';x.fillRect(p.x,p.y,p.w,p.h);if(!bricks.length)for(let r=0;r<5;r++)for(let q=0;q<8;q++)bricks.push({x:q*60+3,y:r*28+30,w:54,h:20,on:1});x.fillStyle='#ff5ca8';x.beginPath();x.arc(b.x,b.y,b.r,0,7);x.fill();bricks.forEach(t=>{if(t.on){x.fillStyle='#5cf0ff';x.fillRect(t.x,t.y,t.w,t.h);if(b.x>t.x&&b.x<t.x+t.w&&b.y-b.r<t.y+t.h&&b.y+b.r>t.y){t.on=0;dy*=-1;score++}}});b.x+=dx;b.y+=dy;if(b.x<8||b.x>472)dx*=-1;if(b.y<8)dy*=-1;if(b.y>p.y-8&&b.x>p.x&&b.x<p.x+p.w)dy=-Math.abs(dy);if(b.y>550){dead=1;x.fillStyle='#fff';x.font='36px system-ui';x.fillText('GAME OVER',145,280)}s.textContent='Score: '+score;requestAnimationFrame(loop)}c.addEventListener('pointermove',e=>{let r=c.getBoundingClientRect();p.x=Math.max(0,Math.min(410,(e.clientX-r.left)/r.width*480-35))});start()</script></body></html>
