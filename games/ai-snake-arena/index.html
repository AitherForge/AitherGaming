<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Snake Arena</title><style>body{margin:0;background:#07120d;color:#eaffef;font:16px system-ui;text-align:center}canvas{display:block;margin:15px auto;max-width:94vw;background:#0c1d14;border:2px solid #63ff91;image-rendering:pixelated}button{padding:10px 18px;border:0;border-radius:10px;font-weight:700}</style></head><body><h1>🐍 Snake Arena</h1><p id=s>Score: 0</p><canvas id=c width=400 height=400></canvas><button onclick=start()>Restart</button><script>const c=document.querySelector('canvas'),x=c.getContext('2d'),s=document.querySelector('#s'),n=20,z=20;let snake,food,dir,next,score,dead,timer;addEventListener('keydown',e=>{let d={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]}[e.key];if(d&&!(d[0]==-dir[0]&&d[1]==-dir[1]))next=d});function start(){clearInterval(timer);snake=[[10,10],[9,10],[8,10]];food=[15,10];dir=next=[1,0];score=0;dead=0;timer=setInterval(tick,110);tick()}function tick(){if(dead)return;dir=next;let h=[snake[0][0]+dir[0],snake[0][1]+dir[1]];if(h[0]<0||h[0]>=n||h[1]<0||h[1]>=n||snake.some(q=>q[0]==h[0]&&q[1]==h[1])){dead=1;draw();x.fillStyle='#fff';x.font='32px system-ui';x.fillText('GAME OVER',105,205);return}snake.unshift(h);if(h[0]==food[0]&&h[1]==food[1]){score++;do food=[Math.random()*n|0,Math.random()*n|0];while(snake.some(q=>q[0]==food[0]&&q[1]==food[1]))}else snake.pop();draw()}function draw(){x.clearRect(0,0,400,400);x.fillStyle='#ffdf57';x.fillRect(food[0]*z,food[1]*z,z,z);x.fillStyle='#63ff91';snake.forEach(q=>x.fillRect(q[0]*z+1,q[1]*z+1,z-2,z-2));s.textContent='Score: '+score}start()</script></body></html>
