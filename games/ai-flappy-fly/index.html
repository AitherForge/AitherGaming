<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Flappy Fly</title><style>body{margin:0;background:#7bdcff;color:#123;text-align:center;font:16px system-ui}canvas{display:block;margin:15px auto;max-width:94vw;background:#bff3ff;border:2px solid #123}button{padding:10px 18px;border:0;border-radius:10px;font-weight:700}</style></head><body><h1>🐦 Flappy Fly</h1><p id=s>Score: 0</p><canvas id=c width=420 height=560></canvas><button onclick=start()>Restart</button><script>const c=document.querySelector('canvas'),x=c.getContext('2d'),s=document.querySelector('#s');let y,vy,pipes,score,dead;function start(){y=280;vy=0;pipes=[];score=0;dead=0;loop()}addEventListener('keydown',e=>{if(e.code==='Space')vy=-7});c.onclick=()=>vy=-7;function loop(){x.clearRect(0,0,420,560);if(dead)return;x.fillStyle='#65b85c';x.fillRect(0,510,420,50);vy+=.35;y+=vy;if(Math.random()<.015)pipes.push({x:430,g:110+Math.random()*230});pipes.forEach(p=>{p.x-=3;x.fillStyle='#35a852';x.fillRect(p.x,0,55,p.g);x.fillRect(p.x,p.g+120,55,510);if(p.x+55<100&&!p.sc){p.sc=1;score++}if(95>p.x&&95<p.x+55&&(y<p.g||y+28>p.g+120))dead=1});pipes=pipes.filter(p=>p.x>-60);x.fillStyle='#ffcf33';x.beginPath();x.arc(100,y,16,0,7);x.fill();if(y<0||y>510)dead=1;s.textContent='Score: '+score;if(dead){x.fillStyle='#123';x.font='36px system-ui';x.fillText('GAME OVER',110,280);return}requestAnimationFrame(loop)}start()</script></body></html>
