<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Math Blitz 2.0</title><style>body{margin:0;background:#101522;color:#fff;text-align:center;font:18px system-ui}input,button{padding:12px;border:0;border-radius:10px;margin:5px;font-size:18px}#q{font-size:48px;margin:35px 0 15px}</style><h1>➗ Math Blitz 2.0</h1><p id=s>Score: 0 • Time: 30 • Streak: 0</p><div id=q>Ready?</div><input id=a type=number inputmode=numeric autofocus><button onclick=begin()>Start</button><button onclick=answer()>Answer</button><script>let n1,n2,op,ans,score,time,streak,running,t,best=+localStorage.mathBest||0;const s=document.querySelector('#s'),q=document.querySelector('#q'),a=document.querySelector('#a');function begin(){clearInterval(t);score=streak=0;time=30;running=1;a.disabled=0;a.focus();next();t=setInterval(()=>{time--;draw();if(time<=0)finish()},1000)}function next(){let lv=1+((30-time)/10|0);n1=2+Math.random()*(10+lv*6)|0;n2=1+Math.random()*(8+lv*4)|0;op=['+','−','×'][Math.random()*3|0];ans=op==='+'?n1+n2:op==='−'?n1-n2:n1*n2;q.textContent=`${n1} ${op} ${n2} = ?`;a.value='';a.focus()}function answer(){if(!running)return;if(+a.value===ans){score+=1+streak;streak++}else streak=0;next();draw()}a.onkeydown=e=>{if(e.key==='Enter')answer()};function draw(){s.textContent=`Score: ${score} • Time: ${time} • Streak: ${streak}`};function finish(){running=0;clearInterval(t);a.disabled=1;best=Math.max(best,score);localStorage.mathBest=best;q.textContent=`Time! ${score} points • Best: ${best}`}draw()</script>
