<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Reaction Rush</title><style>body{margin:0;background:#080d18;color:#fff;font:18px system-ui;text-align:center}#b{width:min(90vw,420px);height:300px;margin:30px auto;border:0;border-radius:24px;background:#26324a;color:#fff;font-size:30px;font-weight:800}button{padding:10px 18px;border:0;border-radius:10px;font-weight:700}</style></head><body><h1>⚡ Reaction Rush</h1><p>Wait for GO, then tap!</p><p id=s>Best: —</p><button id=b>START</button><script>let t,start,best=Infinity,armed=0;b.onclick=()=>{if(armed){let ms=performance.now()-start;if(ms<150){s.textContent='Too early!';}else{best=Math.min(best,ms);s.textContent='Reaction: '+ms.toFixed(0)+' ms • Best: '+best.toFixed(0)+' ms'}armed=0;b.textContent='START';return}b.textContent='Wait…';b.style.background='#26324a';t=setTimeout(()=>{armed=1;start=performance.now();b.textContent='GO!';b.style.background='#18b66a'},900+Math.random()*2200)}</script></body></html>
