<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Mini Mines 2.0</title><style>body{margin:0;background:#1a1d24;color:#fff;text-align:center;font:16px system-ui}.g{display:grid;grid-template-columns:repeat(8,min(11vw,40px));gap:3px;justify-content:center;margin:18px}.c{aspect-ratio:1;border:0;background:#414754;color:#fff;font-weight:800;border-radius:4px}.open{background:#242832}.flag{background:#8a633b}</style><h1>💣 Mini Mines 2.0</h1><p id=s>Find 10 mines • Time: 0 • Flags: 0</p><div class=g id=g></div><button onclick=start()>New Game</button><script>let a,flags=0,sec=0,done=0,t;const g=document.querySelector('#g'),s=document.querySelector('#s');function start(){clearInterval(t);let m=[...Array(64).keys()].sort(()=>Math.random()-.5).slice(0,10);a=[...Array(64)].map((_,i)=>({m:m.includes(i),o:0,f:0,n:0}));a.forEach((v,i)=>v.n=[-9,-8,-7,-1,1,7,8,9].map(d=>i+d).filter(j=>j>=0&&j<64&&Math.abs(j%8-i%8)<=1).filter(j=>a[j].m).length);flags=sec=done=0;t=setInterval(()=>{if(!done){sec++;draw()}},1000);draw()}function reveal(i){if(done||a[i].f||a[i].o)return;if(a[i].m){done=1;a.forEach(q=>q.o=1);draw();return}a[i].o=1;if(a[i].n===0)[-9,-8,-7,-1,1,7,8,9].map(d=>i+d).filter(j=>j>=0&&j<64&&Math.abs(j%8-i%8)<=1).forEach(reveal);if(a.filter(q=>q.o&&!q.m).length===54)done=1;draw()}function flag(i){if(done||a[i].o)return;a[i].f=!a[i].f;flags+=a[i].f?1:-1;draw()}function draw(){g.innerHTML=a.map((v,i)=>`<button class="c ${v.o?'open':''} ${v.f?'flag':''}" onclick="reveal(${i})" oncontextmenu="flag(${i});return false">${v.o?(v.m?'💣':v.n||''):v.f?'⚑':''}</button>`).join('');s.textContent=done?`Game ${a.some(q=>q.o&&q.m)?'over':'won'} • Time: ${sec}s • Flags: ${flags}`:`Find 10 mines • Time: ${sec} • Flags: ${flags}`}start()</script>
