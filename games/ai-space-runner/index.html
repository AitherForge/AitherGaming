<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Space Runner</title><style>body{margin:0;background:#050516;color:#fff;text-align:center;font:16px system-ui}canvas{display:block;margin:15px auto;max-width:94vw;background:#09092a;border:2px solid #9a7cff}button{padding:10px 18px;border:0;border-radius:10px}</style></head><body><h1>🚀 Space Runner</h1><p id=s>Distance: 0</p><canvas id=c width=460 height=500></canvas><button onclick=start()>Restart</button><script>const c=document.querySelector('canvas'),x=c.getContext('2d'),s=document.querySelector('#s');let y,obs,d,score,keys={};function start(){y=250;obs=[];score=0;d=0;loop()}addEventListener('keydown',e=>keys[e.key]=1);addEventListener('keyup',e=>keys[e.key]=0);function loop(){if(d)return;x.clearRect(0,0,460,500);y+=(keys.ArrowDown?5:0)-(keys.ArrowUp?5:0);y=Math.max(20,Math.min(460,y));if(Math.random()<.025)obs.push({x:470,y:Math.random()*450+20,r:15+Math.random()*15});obs.forEach(o=>{o.x-=5;x.fillStyle='#ff4e7a';x.beginPath();x.arc(o.x,o.y,o.r,0,7);x.fill();if(Math.hypot(o.x-70,o.y-y)<o.r+14)d=1});obs=obs.filter(o=>o.x>-40);x.fillStyle='#65e8ff';x.beginPath();x.moveTo(45,y);x.lineTo(85,y-14);x.lineTo(85,y+14);x.fill();score++;s.textContent='Distance: '+score;if(d){x.fillStyle='#fff';x.font='36px system-ui';x.fillText('CRASH!',175,250);return}requestAnimationFrame(loop)}start()</script></body></html>
