<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Flappy Fly 2.0</title><style>body{margin:0;background:#7bdcff;color:#123;text-align:center;font:16px system-ui}canvas{display:block;margin:12px auto;max-width:94vw;background:#bff3ff;border:2px solid #123;border-radius:12px;touch-action:none}button{padding:10px 18px;border:0;border-radius:10px;font-weight:700}</style><h1>🐦 Flappy Fly 2.0</h1><p id=s>Score: 0 • Best: 0 • Level: 1</p><canvas id=c width=420 height=560></canvas><button onclick=start()>Restart</button><script>const c=document.querySelector('canvas'),x=c.getContext('2d'),s=document.querySelector('#s');let y,vy,pipes,score,dead,best=+localStorage.flapBest||0;function start(){y=280;vy=0;pipes=[];score=0;dead=0;requestAnimationFrame(loop)}function flap(){if(dead)start();else vy=-7}onkeydown=e=>{if(e.code==='Space'||e.key==='ArrowUp')flap()};c.onpointerdown=flap;function loop(){if(dead)return;x.clearRect(0,0,420,560);vy+=.35;y+=vy;let lv=1+(score/8|0),speed=3+lv*.15;if(Math.random()<.015)pipes.push({x:430,g:100+Math.random()*240,sc:0});pipes.forEach(p=>{p.x-=speed;x.fillStyle='#35a852';x.fillRect(p.x,0,55,p.g);x.fillRect(p.x,p.g+120,55,510);if(!p.sc&&p.x+55<100){p.sc=1;score++;best=Math.max(best,score);localStorage.flapBest=best}if(95>p.x&&95<p.x+55&&(y< p.g||y+28>p.g+120))dead=1});pipes=pipes.filter(p=>p.x>-60);x.fillStyle='#ffcf33';x.beginPath();x.arc(100,y,16,0,7);x.fill();if(y<0||y>510)dead=1;s.textContent=`Score: ${score} • Best: ${best} • Level: ${lv}`;if(dead){x.fillStyle='#123';x.font='bold 36px system-ui';x.textAlign='center';x.fillText('GAME OVER',210,280);x.font='16px system-ui';x.fillText('Tap to restart',210,315);x.textAlign='left';return}requestAnimationFrame(loop)}start()</script>
