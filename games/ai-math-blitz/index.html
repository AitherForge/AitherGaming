<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Math Blitz</title><style>body{margin:0;background:#101522;color:#fff;text-align:center;font:18px system-ui}input,button{padding:12px;border:0;border-radius:10px;margin:5px;font-size:18px}#q{font-size:48px;margin:40px 0 15px}</style></head><body><h1>➗ Math Blitz</h1><p id=s>Score: 0 • Time: 30</p><div id=q></div><input id=a type=number autofocus><button onclick=answer()>Answer</button><script>let n1,n2,op,ans,score=0,time=30;function next(){n1=2+Math.random()*18|0;n2=1+Math.random()*12|0;op=['+','−','×'][Math.random()*3|0];ans=op==='+'?n1+n2:op==='−'?n1-n2:n1*n2;q.textContent=n1+' '+op+' '+n2+' = ?';a.value='';a.focus()}function answer(){if(+a.value===ans)score++;next()}a.onkeydown=e=>{if(e.key==='Enter')answer()};let timer=setInterval(()=>{time--;s.textContent=`Score: ${score} • Time: ${time}`;if(time<=0){clearInterval(timer);q.textContent='Time! Final score: '+score;a.disabled=1}},1000);next()</script></body></html>
