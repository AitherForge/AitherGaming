<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Asteroid Blaster</title><style>body{margin:0;background:#03050a;color:#fff;text-align:center;font:16px system-ui}canvas{display:block;margin:15px auto;max-width:94vw;background:#080d18;border:2px solid #fff;touch-action:none}</style></head><body><h1>☄️ Asteroid Blaster</h1><p id=s>Score: 0</p><canvas id=c width=480 height=600></canvas><script>const c=document.querySelector('canvas'),x=c.getContext('2d'),s=document.querySelector('#s');let ship,rocks,shots,score,over,keys={};function start(){ship={x:220,y:540};rocks=[];shots=[];score=0;over=0;loop()}addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.code==='Space')shots.push({x:ship.x+18,y:ship.y})});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);c.addEventListener('pointermove',e=>{let r=c.getBoundingClientRect();ship.x=(e.clientX-r.left)/r.width*480-18});function loop(){if(over)return;x.clearRect(0,0,480,600);if(keys.a||keys.arrowleft)ship.x-=6;if(keys.d||keys.arrowright)ship.x+=6;ship.x=Math.max(0,Math.min(444,ship.x));x.fillStyle='#57e6ff';x.fillRect(ship.x,ship.y,36,24);if(Math.random()<.025)rocks.push({x:Math.random()*450,y:-30,r:10+Math.random()*20,v:2+Math.random()*3});x.fillStyle='#ff704d';rocks.forEach(r=>{r.y+=r.v;x.beginPath();x.arc(r.x,r.y,r.r,0,7);x.fill();if(r.y>520&&r.x>ship.x-10&&r.x<ship.x+46)over=1});shots.forEach(q=>{q.y-=9;x.fillStyle='#ffe65c';x.fillRect(q.x,q.y,4,12);rocks.forEach(r=>{if(Math.hypot(q.x-r.x,q.y-r.y)<r.r){r.y=700;score++}})});rocks=rocks.filter(r=>r.y<650);shots=shots.filter(q=>q.y>-20);s.textContent='Score: '+score;if(over){x.fillStyle='#fff';x.font='38px system-ui';x.fillText('SHIP DESTROYED',100,300);return}requestAnimationFrame(loop)}start()</script></body></html>
