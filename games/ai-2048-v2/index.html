<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>2048 2.0</title><style>body{margin:0;background:#faf8ef;color:#776e65;text-align:center;font:18px system-ui}.grid{display:grid;grid-template-columns:repeat(4,min(20vw,78px));gap:8px;justify-content:center;background:#bbada0;padding:8px;border-radius:10px;margin:18px}.tile{aspect-ratio:1;border:0;border-radius:7px;background:#cdc1b4;font-size:25px;font-weight:800;color:#776e65}.hi{background:#edc22e;color:#fff}button#new{padding:10px 18px;border:0;border-radius:10px;font-weight:700}</style><h1>🔢 2048 2.0</h1><p id=s>Score: 0 • Best: 0</p><div class=grid id=g></div><button id=new onclick=start()>New Game</button><script>let a,score=0,best=+localStorage.g2048Best||0;const g=document.querySelector('#g'),s=document.querySelector('#s');function add(){let e=a.map((v,i)=>v?null:i).filter(i=>i!==null);if(e.length)a[e[Math.random()*e.length|0]]=Math.random()<.9?2:4}function draw(){g.innerHTML=a.map(v=>`<button class=tile>${v||''}</button>`).join('');best=Math.max(best,score);localStorage.g2048Best=best;s.textContent=`Score: ${score} • Best: ${best}`}function move(d){let old=a.join(),out=[];for(let r=0;r<4;r++){let row=d<2?a.slice(r*4,r*4+4):[a[r],a[r+4],a[r+8],a[r+12]];if(d%2)row.reverse();row=row.filter(Boolean);for(let i=0;i<row.length-1;i++)if(row[i]===row[i+1]){row[i]*=2;score+=row[i];row.splice(i+1,1)}while(row.length<4)row.push(0);if(d%2)row.reverse();if(d<2)a.splice(r*4,4,...row);else row.forEach((v,i)=>a[r+i*4]=v)}if(a.join()!==old)add();draw();if(!canMove()){s.textContent=`Game over • Score: ${score} • Best: ${best}`}}function canMove(){if(a.includes(0))return 1;for(let r=0;r<4;r++)for(let q=0;q<4;q++){let i=r*4+q;if(q<3&&a[i]===a[i+1]||r<3&&a[i]===a[i+4])return 1}return 0}onkeydown=e=>{let d={ArrowLeft:0,ArrowRight:1,ArrowUp:2,ArrowDown:3}[e.key];if(d!==undefined){e.preventDefault();move(d)}};let sx,sy;g.ontouchstart=e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY};g.ontouchend=e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;move(Math.abs(dx)>Math.abs(dy)?dx<0?0:1:dy<0?2:3)};function start(){a=Array(16).fill(0);score=0;add();add();draw()}start()</script>
