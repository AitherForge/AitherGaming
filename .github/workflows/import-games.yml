name: Import Aither Gaming

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-games.yml'
      - 'scripts/import_games.py'

permissions:
  contents: write

concurrency:
  group: aither-gaming-import
  cancel-in-progress: false

jobs:
  import-games:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Aither Gaming
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Clone AA Gamerz collection and download UGS Google Drive folder
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/aa /tmp/ugs
          git clone --depth 1 https://github.com/aa-gamerz22/aa-gamerz-games.git /tmp/aa

          python3 -m pip install --disable-pip-version-check --no-input gdown
          gdown --folder 'https://drive.google.com/drive/folders/1ou3mI5xJVQv8Vt_MvwejPtf7zStSnU-s' -O /tmp/ugs --remaining-ok

          test -d /tmp/ugs
          echo "UGS Google Drive contents:"
          find /tmp/ugs -maxdepth 2 -type f | head -50

      - name: Copy 100 real games into games/
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/import_games.py /tmp/aa /tmp/ugs
          test -d games
          folders=$(find games -mindepth 1 -maxdepth 1 -type d | wc -l)
          indexes=$(find games -mindepth 2 -maxdepth 2 -name index.html -type f | wc -l)
          echo "Game folders: $folders"
          echo "Playable entry points: $indexes"
          test "$folders" -eq 100
          test "$indexes" -eq 100
          test -s games.json
          test -s CREDITS.md

      - name: Commit the actual local game files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Aither Gaming Importer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A games games.json CREDITS.md
          if git diff --cached --quiet; then
            echo "No game changes to commit."
            exit 0
          fi
          git diff --cached --stat
          git commit -m "Import 100 local games from UGS Google Drive [skip ci]"

          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo "Game import pushed successfully."
              exit 0
            fi
            echo "Push/rebase attempt $attempt failed; retrying from a clean sync..."
            git rebase --abort 2>/dev/null || true
            git reset --hard HEAD
          done

          echo "Unable to push the imported games after 3 attempts."
          exit 1
