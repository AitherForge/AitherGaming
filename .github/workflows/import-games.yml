name: Import Aither Gaming

# TEMPORARY: GitHub-only game import. Google Drive is intentionally disabled for this run.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-games.yml'
      - 'scripts/import_games.py'

permissions:
  contents: write

concurrency:
  group: aither-gaming-import
  cancel-in-progress: false

jobs:
  import-games:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout Aither Gaming
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Sync checkout before generating imports
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          git clean -fd

      - name: Clone all temporary GitHub game collections
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ugs /tmp/eaglercraft-extras /tmp/aa /tmp/shrimpy-game-box /tmp/jsgames /tmp/html-minigames /tmp/classic-games-collection

          clone_with_retry() {
            local url="$1"
            local destination="$2"
            for attempt in 1 2 3 4 5; do
              echo "Cloning $url (attempt $attempt/5)..."
              rm -rf "$destination"
              if git clone --depth 1 --no-tags "$url" "$destination"; then
                return 0
              fi
              if [ "$attempt" -lt 5 ]; then sleep $((attempt * 10)); fi
            done
            echo "Unable to clone $url after 5 attempts."
            return 1
          }

          clone_with_retry https://github.com/bubbls/UGS-Assets.git /tmp/ugs
          clone_with_retry https://github.com/x8rr/Eaglercraft-Extras.git /tmp/eaglercraft-extras
          clone_with_retry https://github.com/aa-gamerz22/aa-gamerz-games.git /tmp/aa
          clone_with_retry https://github.com/Shrimpy-com/Shrimpy-Game-Box.git /tmp/shrimpy-game-box
          clone_with_retry https://github.com/mariohd/JSGames.git /tmp/jsgames
          clone_with_retry https://github.com/Rysm/html-minigames.git /tmp/html-minigames
          clone_with_retry https://github.com/stphung/classic-games-collection.git /tmp/classic-games-collection

      - name: Import every usable GitHub game
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            echo "GitHub-only import attempt $attempt/5..."
            if python3 scripts/import_games.py /tmp/ugs /tmp/eaglercraft-extras /tmp/aa /tmp/shrimpy-game-box /tmp/jsgames /tmp/html-minigames /tmp/classic-games-collection; then
              test -d games
              folders=$(find games -mindepth 1 -maxdepth 1 -type d | wc -l)
              indexes=$(find games -mindepth 2 -maxdepth 2 -name index.html -type f | wc -l)
              files=$(find games -type f | wc -l)
              echo "Total game folders including AI Originals: $folders"
              echo "Total playable entry points including AI Originals: $indexes"
              echo "Total game files including assets: $files"
              test "$folders" -gt 0
              test "$indexes" -gt 0
              test "$files" -ge "$indexes"
              test -s games.json
              test -s CREDITS.md
              if grep -q 'UGS Google Drive' games.json; then
                echo "ERROR: Google Drive games were imported during the temporary GitHub-only run."
                exit 1
              fi
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then sleep $((attempt * 10)); fi
          done
          echo "GitHub-only import failed after 5 attempts."
          exit 1

      - name: Verify files are safe for GitHub
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            echo "GitHub safety verification attempt $attempt/5..."
            bad=0
            while IFS= read -r -d '' file; do
              size=$(stat -c '%s' "$file")
              if [ "$size" -ge 100000000 ]; then
                echo "ERROR: file is too large for GitHub: $file ($size bytes)"
                bad=1
              fi
            done < <(find games -type f -print0)
            if [ "$bad" -eq 0 ]; then
              echo "All imported files are below GitHub's per-file limit."
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then sleep $((attempt * 10)); fi
          done
          echo "GitHub safety verification failed after 5 attempts."
          exit 1

      - name: Commit and push imported game files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Aither Gaming Importer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.compression 0
          git config http.version HTTP/1.1

          echo "Removing stale nested Git metadata..."
          find games -type d -name .git -prune -exec rm -rf {} + 2>/dev/null || true
          find games -type f \( -name .gitmodules -o -name .gitignore -o -name .gitattributes \) -delete 2>/dev/null || true

          # Remove old gitlinks from the index, then FORCE-STAGE the entire games
          # tree. This is important because imported games can contain files that
          # match patterns in the repository's ignore rules (WASM, data files,
          # source maps, assets, etc.). Nothing inside games should be omitted.
          git rm -r --cached --ignore-unmatch games >/dev/null 2>&1 || true
          git add -A -f games games.json CREDITS.md
          git status --short

          staged_games=$(git diff --cached --name-only -- 'games/**' | wc -l)
          working_games=$(find games -type f | wc -l)
          echo "Game files on disk: $working_games"
          echo "Game files staged for Git: $staged_games"

          if [ "$staged_games" -lt "$working_games" ]; then
            echo "ERROR: not every game file was staged."
            echo "Unstaged/untracked game files:"
            git status --short --untracked-files=all -- games
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "No game changes to commit."
            exit 0
          fi

          if git diff --cached --raw | grep -q '160000'; then
            echo "ERROR: a nested Git submodule entry is still staged."
            git diff --cached --raw | grep '160000' || true
            exit 1
          fi

          echo "Staged file count: $(git diff --cached --name-only | wc -l)"
          git commit --no-verify -m "Import complete GitHub game files"

          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt/5..."
            git fetch origin main

            if ! git merge-base --is-ancestor origin/main HEAD; then
              echo "main changed while the import was running. Preparing a clean rebase."
              if [ -n "$(git status --porcelain)" ]; then
                git stash push --include-untracked --message "aither-import-safety-stash-$attempt"
                STASHED=1
              else
                STASHED=0
              fi
              if ! git rebase origin/main; then
                git rebase --abort || true
                if [ "$STASHED" -eq 1 ]; then git stash pop || true; fi
                sleep $((attempt * 10))
                continue
              fi
              if [ "$STASHED" -eq 1 ]; then git stash pop || exit 1; fi
            fi

            if [ -n "$(git status --porcelain)" ]; then
              echo "ERROR: working tree is dirty before push:"
              git status --short
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Complete game import pushed successfully."
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then sleep $((attempt * 10)); fi
          done

          echo "Unable to push imported games after 5 attempts."
          exit 1
