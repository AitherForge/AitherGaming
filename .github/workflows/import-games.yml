name: Import Aither Gaming

# TEMPORARY: GitHub-only game import. Google Drive is intentionally disabled for this run.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-games.yml'
      - 'scripts/import_games.py'

permissions:
  contents: write

concurrency:
  group: aither-gaming-import
  cancel-in-progress: false

jobs:
  import-games:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout Aither Gaming
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Clone all temporary GitHub game collections
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ugs /tmp/eaglercraft-extras /tmp/aa /tmp/shrimpy-game-box /tmp/jsgames /tmp/html-minigames /tmp/classic-games-collection

          clone_with_retry() {
            local url="$1"
            local destination="$2"
            for attempt in 1 2 3 4 5; do
              echo "Cloning $url (attempt $attempt/5)..."
              rm -rf "$destination"
              if git clone --depth 1 --no-tags "$url" "$destination"; then
                return 0
              fi
              if [ "$attempt" -lt 5 ]; then sleep $((attempt * 10)); fi
            done
            echo "Unable to clone $url after 5 attempts."
            return 1
          }

          # Previously selected collections.
          clone_with_retry https://github.com/bubbls/UGS-Assets.git /tmp/ugs
          clone_with_retry https://github.com/x8rr/Eaglercraft-Extras.git /tmp/eaglercraft-extras
          clone_with_retry https://github.com/aa-gamerz22/aa-gamerz-games.git /tmp/aa
          clone_with_retry https://github.com/Shrimpy-com/Shrimpy-Game-Box.git /tmp/shrimpy-game-box

          # Three additional temporary collections.
          clone_with_retry https://github.com/mariohd/JSGames.git /tmp/jsgames
          clone_with_retry https://github.com/Rysm/html-minigames.git /tmp/html-minigames
          clone_with_retry https://github.com/stphung/classic-games-collection.git /tmp/classic-games-collection

      - name: Import every usable GitHub game
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            echo "GitHub-only import attempt $attempt/5..."
            if python3 scripts/import_games.py /tmp/ugs /tmp/eaglercraft-extras /tmp/aa /tmp/shrimpy-game-box /tmp/jsgames /tmp/html-minigames /tmp/classic-games-collection; then
              test -d games
              folders=$(find games -mindepth 1 -maxdepth 1 -type d | wc -l)
              indexes=$(find games -mindepth 2 -maxdepth 2 -name index.html -type f | wc -l)
              echo "Total game folders including AI Originals: $folders"
              echo "Total playable entry points including AI Originals: $indexes"
              test "$folders" -gt 0
              test "$indexes" -gt 0
              test -s games.json
              test -s CREDITS.md
              if grep -q 'UGS Google Drive' games.json; then
                echo "ERROR: Google Drive games were imported during the temporary GitHub-only run."
                exit 1
              fi
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then sleep $((attempt * 10)); fi
          done
          echo "GitHub-only import failed after 5 attempts."
          exit 1

      - name: Verify files are safe for GitHub
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            echo "GitHub safety verification attempt $attempt/5..."
            bad=0
            while IFS= read -r -d '' file; do
              size=$(stat -c '%s' "$file")
              if [ "$size" -ge 100000000 ]; then
                echo "ERROR: file is too large for GitHub: $file ($size bytes)"
                bad=1
              fi
            done < <(find games -type f -print0)
            if [ "$bad" -eq 0 ]; then
              echo "All imported files are below GitHub's per-file limit."
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then sleep $((attempt * 10)); fi
          done
          echo "GitHub safety verification failed after 5 attempts."
          exit 1

      - name: Commit and push imported game files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Aither Gaming Importer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.compression 0
          git config http.version HTTP/1.1

          echo "Staging imported game files..."
          git add games games.json CREDITS.md
          git status --short

          if git diff --cached --quiet; then
            echo "No game changes to commit."
            exit 0
          fi

          echo "Staged file count: $(git diff --cached --name-only | wc -l)"
          echo "Creating import commit..."
          git commit --no-verify -m "Temporarily import GitHub game collections"

          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt/5..."
            git fetch origin main
            if git merge-base --is-ancestor origin/main HEAD; then
              if git push origin HEAD:main; then
                echo "Game import pushed successfully."
                exit 0
              fi
            else
              echo "main changed while the import was running. Rebuilding the commit on top of origin/main."
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Game import pushed successfully after rebase."
                exit 0
              fi
            fi
            if [ "$attempt" -lt 5 ]; then sleep $((attempt * 10)); fi
          done

          echo "Unable to push imported games after 5 attempts."
          exit 1
