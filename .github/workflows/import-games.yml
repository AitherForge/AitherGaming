name: Import Aither Gaming

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-games.yml'
      - 'scripts/import_games.py'

permissions:
  contents: write

concurrency:
  group: aither-gaming-import
  cancel-in-progress: false

jobs:
  import-games:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout Aither Gaming
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install import tools
        shell: bash
        run: python3 -m pip install --disable-pip-version-check --no-input gdown

      - name: Download 100 UGS games from Google Drive
        shell: bash
        run: |
          set -euo pipefail
          DRIVE_URL="https://drive.google.com/drive/folders/1ou3mI5xJVQv8Vt_MvwejPtf7zStSnU-s"
          for attempt in 1 2 3; do
            echo "UGS Google Drive download attempt $attempt/3..."
            rm -rf /tmp/ugs-drive
            mkdir -p /tmp/ugs-drive
            if gdown --folder "$DRIVE_URL" -O /tmp/ugs-drive --remaining-ok --continue; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "UGS Google Drive download failed after 3 attempts."
              exit 1
            fi
            sleep $((attempt * 10))
          done
          file_count=$(find /tmp/ugs-drive -type f | wc -l)
          echo "Downloaded UGS Drive files: $file_count"
          test "$file_count" -gt 0

      - name: Clone all GitHub game collections
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ugs /tmp/eaglercraft-extras /tmp/aa

          clone_with_retry() {
            local url="$1"
            local destination="$2"
            for attempt in 1 2 3; do
              echo "Cloning $url (attempt $attempt/3)..."
              rm -rf "$destination"
              if git clone --depth 1 --no-tags --filter=blob:none "$url" "$destination"; then
                return 0
              fi
              sleep $((attempt * 10))
            done
            echo "Unable to clone $url after 3 attempts."
            return 1
          }

          clone_with_retry https://github.com/bubbls/UGS-Assets.git /tmp/ugs
          clone_with_retry https://github.com/x8rr/Eaglercraft-Extras.git /tmp/eaglercraft-extras
          clone_with_retry https://github.com/aa-gamerz22/aa-gamerz-games.git /tmp/aa

      - name: Import Drive games and every usable GitHub game
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/import_games.py /tmp/ugs-drive /tmp/ugs /tmp/eaglercraft-extras /tmp/aa
          test -d games
          folders=$(find games -mindepth 1 -maxdepth 1 -type d | wc -l)
          indexes=$(find games -mindepth 2 -maxdepth 2 -name index.html -type f | wc -l)
          drive_count=$(grep -c 'UGS Google Drive' games.json || true)
          echo "Total game folders including AI Originals: $folders"
          echo "Total playable entry points including AI Originals: $indexes"
          echo "UGS Drive games in manifest: $drive_count"
          test "$folders" -gt 0
          test "$indexes" -gt 0
          test "$drive_count" -eq 100
          test -s games.json
          test -s CREDITS.md

      - name: Prepare repository for GitHub limits
        shell: bash
        run: |
          set -euo pipefail
          # GitHub rejects individual files at 100 MiB or larger. Keep a safety
          # margin so the import can always be committed and pushed normally.
          oversized=0
          while IFS= read -r -d '' file; do
            size=$(stat -c '%s' "$file")
            if [ "$size" -ge 99614720 ]; then
              echo "Skipping GitHub-incompatible file (${size} bytes): $file"
              rm -f "$file"
              oversized=$((oversized + 1))
            fi
          done < <(find games -type f -print0)
          echo "Oversized files removed: $oversized"
          git config core.longpaths true
          git config core.compression 1
          git config pack.windowMemory 50m
          git config pack.packSizeLimit 50m
          git config pack.threads 2
          df -h .

      - name: Commit and push imported game files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Aither Gaming Importer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Staging imported game files..."
          git add -A -- games games.json CREDITS.md

          staged_files=$(git diff --cached --name-only | wc -l)
          staged_bytes=$(git diff --cached --numstat | awk '{a+=$1; d+=$2} END {print a+d+0}')
          echo "Staged paths: $staged_files"
          echo "Staged line changes: $staged_bytes"

          if git diff --cached --quiet; then
            echo "No game changes to commit."
            exit 0
          fi

          echo "Creating import commit..."
          git commit --no-verify -m "Import Aither Gaming game collections [skip ci]"

          # Another run can update main while this job is importing. Rebase the
          # completed import commit onto the newest main before pushing.
          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt/5..."
            git fetch --prune origin main

            if ! git merge-base --is-ancestor origin/main HEAD; then
              echo "Remote main advanced; rebasing import commit..."
              if ! git rebase origin/main; then
                echo "Rebase conflict; resetting to the import commit and retrying from remote main."
                git rebase --abort 2>/dev/null || true
                git reset --hard HEAD
                git rebase origin/main
              fi
            fi

            if git -c http.version=HTTP/1.1 push origin HEAD:main; then
              echo "Game import pushed successfully."
              exit 0
            fi

            echo "Push attempt $attempt failed; refreshing and retrying..."
            sleep $((attempt * 10))
          done

          echo "Unable to push the imported games after 5 attempts."
          exit 1
