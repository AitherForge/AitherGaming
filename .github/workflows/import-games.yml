name: Import Aither Gaming

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-games.yml'
      - 'scripts/import_games.py'

permissions:
  contents: write

concurrency:
  group: aither-gaming-import
  cancel-in-progress: false

jobs:
  import-games:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout Aither Gaming
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install import tools
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            echo "Installing import tools (attempt $attempt/5)..."
            if python3 -m pip install --disable-pip-version-check --no-input --upgrade gdown && gdown --version; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then sleep $((attempt * 10)); fi
          done
          echo "Unable to install import tools after 5 attempts."
          exit 1

      - name: Preflight Google Drive access
        shell: bash
        run: |
          set -euo pipefail
          DRIVE_URL="https://drive.google.com/drive/folders/1ou3mI5xJVQv8Vt_MvwejPtf7zStSnU-s"
          access_ok=0
          for attempt in 1 2 3 4 5; do
            echo "UGS Google Drive access preflight attempt $attempt/5..."
            rm -f /tmp/ugs-drive-list.json
            if gdown "$DRIVE_URL" --folder --json --quiet > /tmp/ugs-drive-list.json; then
              entry_count=$(python3 - <<'PY'
import json
from pathlib import Path
path = Path('/tmp/ugs-drive-list.json')
data = json.loads(path.read_text(encoding='utf-8'))
print(len(data) if isinstance(data, list) else 0)
PY
)
              echo "Google Drive folder is accessible to this GitHub runner."
              echo "Google Drive entries visible: $entry_count"
              if [ "$entry_count" -gt 0 ]; then
                access_ok=1
                break
              fi
              echo "The folder was reachable, but no downloadable entries were visible."
            else
              echo "Google Drive access failed."
              echo "If this folder is restricted to a school/work Google account, GitHub Actions cannot use that signed-in account automatically."
            fi
            if [ "$attempt" -lt 5 ]; then sleep $((attempt * 10)); fi
          done
          if [ "$access_ok" -ne 1 ]; then
            echo "ERROR: Google Drive preflight failed after 5 attempts."
            echo "The UGS folder must be accessible without a personal/school browser login (normally 'Anyone with the link' as Viewer), or the workflow needs authenticated Google Drive credentials stored as GitHub Actions secrets."
            exit 1
          fi

      - name: Download 200 UGS games from Google Drive
        shell: bash
        run: |
          set -euo pipefail
          DRIVE_URL="https://drive.google.com/drive/folders/1ou3mI5xJVQv8Vt_MvwejPtf7zStSnU-s"
          success=0
          for attempt in 1 2 3 4 5; do
            echo "UGS Google Drive download attempt $attempt/5..."
            rm -rf /tmp/ugs-drive
            mkdir -p /tmp/ugs-drive
            if gdown "$DRIVE_URL" -O /tmp/ugs-drive --folder; then
              success=1
              break
            fi
            if [ "$attempt" -lt 5 ]; then sleep $((attempt * 10)); fi
          done
          if [ "$success" -ne 1 ]; then
            echo "UGS Google Drive download failed after 5 attempts."
            exit 1
          fi
          file_count=$(find /tmp/ugs-drive -type f | wc -l)
          echo "Downloaded UGS Drive files: $file_count"
          test "$file_count" -gt 0

      - name: Clone all GitHub game collections
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ugs /tmp/eaglercraft-extras /tmp/aa

          clone_with_retry() {
            local url="$1"
            local destination="$2"
            for attempt in 1 2 3 4 5; do
              echo "Cloning $url (attempt $attempt/5)..."
              rm -rf "$destination"
              if git clone --depth 1 --no-tags "$url" "$destination"; then
                return 0
              fi
              if [ "$attempt" -lt 5 ]; then sleep $((attempt * 10)); fi
            done
            echo "Unable to clone $url after 5 attempts."
            return 1
          }

          clone_with_retry https://github.com/bubbls/UGS-Assets.git /tmp/ugs
          clone_with_retry https://github.com/x8rr/Eaglercraft-Extras.git /tmp/eaglercraft-extras
          clone_with_retry https://github.com/aa-gamerz22/aa-gamerz-games.git /tmp/aa

      - name: Import Drive games and every usable GitHub game
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            echo "Import attempt $attempt/5..."
            if python3 scripts/import_games.py /tmp/ugs-drive /tmp/ugs /tmp/eaglercraft-extras /tmp/aa; then
              test -d games
              folders=$(find games -mindepth 1 -maxdepth 1 -type d | wc -l)
              indexes=$(find games -mindepth 2 -maxdepth 2 -name index.html -type f | wc -l)
              drive_count=$(grep -c 'UGS Google Drive' games.json || true)
              echo "Total game folders including AI Originals: $folders"
              echo "Total playable entry points including AI Originals: $indexes"
              echo "UGS Drive games in manifest: $drive_count"
              test "$folders" -gt 0
              test "$indexes" -gt 0
              test "$drive_count" -eq 200
              test -s games.json
              test -s CREDITS.md
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then sleep $((attempt * 10)); fi
          done
          echo "Import failed after 5 attempts."
          exit 1

      - name: Verify files are safe for GitHub
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            echo "GitHub safety verification attempt $attempt/5..."
            bad=0
            while IFS= read -r -d '' file; do
              size=$(stat -c '%s' "$file")
              if [ "$size" -ge 100000000 ]; then
                echo "ERROR: file is too large for GitHub: $file ($size bytes)"
                bad=1
              fi
            done < <(find games -type f -print0)
            if [ "$bad" -eq 0 ]; then
              echo "All imported files are below GitHub's per-file limit."
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then sleep $((attempt * 10)); fi
          done
          echo "GitHub safety verification failed after 5 attempts."
          exit 1

      - name: Commit and push imported game files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Aither Gaming Importer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.compression 0
          git config http.version HTTP/1.1

          echo "Staging imported game files..."
          git add games games.json CREDITS.md
          git status --short

          if git diff --cached --quiet; then
            echo "No game changes to commit."
            exit 0
          fi

          echo "Staged file count: $(git diff --cached --name-only | wc -l)"
          echo "Creating import commit..."
          git commit --no-verify -m "Import Aither Gaming game collections"

          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt/5..."
            git fetch origin main
            if git merge-base --is-ancestor origin/main HEAD; then
              if git push origin HEAD:main; then
                echo "Game import pushed successfully."
                exit 0
              fi
            else
              echo "main changed while the import was running. Rebuilding the commit on top of origin/main."
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Game import pushed successfully after rebase."
                exit 0
              fi
            fi
            if [ "$attempt" -lt 5 ]; then sleep $((attempt * 10)); fi
          done

          echo "Unable to push imported games after 5 attempts."
          exit 1
