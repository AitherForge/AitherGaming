name: Import Aither Gaming

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-games.yml'
      - 'scripts/import_games.py'
      - 'index.html'

permissions:
  contents: write

concurrency:
  group: aither-gaming-import
  cancel-in-progress: true

jobs:
  import-games:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Aither Gaming
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Clone supplied game collections
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/aa /tmp/ugs
          git clone --depth 1 https://github.com/aa-gamerz22/aa-gamerz-games.git /tmp/aa
          git clone --depth 1 https://github.com/bubbls/UGS-Assets.git /tmp/ugs

      - name: Copy 100 real games into games/
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/import_games.py /tmp/aa /tmp/ugs
          test -d games
          folders=$(find games -mindepth 1 -maxdepth 1 -type d | wc -l)
          indexes=$(find games -mindepth 2 -maxdepth 2 -name index.html -type f | wc -l)
          echo "Game folders: $folders"
          echo "Playable entry points: $indexes"
          test "$folders" -eq 100
          test "$indexes" -eq 100
          test -s games.json
          test -s CREDITS.md

      - name: Commit the actual local game files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Aither Gaming Importer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Only commit generated game content. app.js is intentionally excluded
          # because it contains the Aither Account integration.
          git add -A games games.json CREDITS.md
          if git diff --cached --quiet; then
            echo "No game changes to commit."
            exit 0
          fi

          git commit -m "Add 100 local game source folders [skip ci]"

          # The repository may receive another Aither change while the large
          # game import is running. Rebase onto the newest main before pushing.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Game import pushed successfully."
              exit 0
            fi
            echo "Push attempt $attempt failed; syncing with origin/main..."
            git fetch origin main
            git rebase origin/main
          done

          echo "Unable to push the imported games after 3 attempts."
          exit 1
