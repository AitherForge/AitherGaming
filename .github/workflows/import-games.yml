name: Import Aither Gaming

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-games.yml'
      - 'scripts/import_games.py'
      - 'index.html'

permissions:
  contents: write

jobs:
  import-games:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Aither Gaming
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Clone supplied game collections
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/aa /tmp/ugs
          git clone --depth 1 https://github.com/aa-gamerz22/aa-gamerz-games.git /tmp/aa
          git clone --depth 1 https://github.com/bubbls/UGS-Assets.git /tmp/ugs

      - name: Copy 100 real games into games/
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/import_games.py /tmp/aa /tmp/ugs
          test -d games
          folders=$(find games -mindepth 1 -maxdepth 1 -type d | wc -l)
          indexes=$(find games -mindepth 2 -maxdepth 2 -name index.html -type f | wc -l)
          echo "Game folders: $folders"
          echo "Playable entry points: $indexes"
          test "$folders" -eq 100
          test "$indexes" -eq 100
          test -s games.json
          test -s CREDITS.md

      - name: Commit the actual local game files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Aither Gaming Importer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A games games.json app.js CREDITS.md README.md index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add 100 local game source folders [skip ci]"
          git push origin HEAD:main
