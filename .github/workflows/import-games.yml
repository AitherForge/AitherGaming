name: Import Aither Gaming

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-games.yml'
      - 'scripts/import_games.py'

permissions:
  contents: write

concurrency:
  group: aither-gaming-import
  cancel-in-progress: false

jobs:
  import-games:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout Aither Gaming
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Clone all GitHub game collections
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ugs /tmp/eaglercraft-extras /tmp/aa

          clone_with_retry() {
            local url="$1"
            local destination="$2"
            for attempt in 1 2 3; do
              echo "Cloning $url (attempt $attempt/3)..."
              rm -rf "$destination"
              if git clone --depth 1 --no-tags "$url" "$destination"; then
                return 0
              fi
              echo "Clone failed; retrying..."
              sleep $((attempt * 5))
            done
            echo "Unable to clone $url after 3 attempts."
            return 1
          }

          clone_with_retry https://github.com/bubbls/UGS-Assets.git /tmp/ugs
          clone_with_retry https://github.com/x8rr/Eaglercraft-Extras.git /tmp/eaglercraft-extras
          clone_with_retry https://github.com/aa-gamerz22/aa-gamerz-games.git /tmp/aa

          test -d /tmp/ugs
          test -d /tmp/eaglercraft-extras
          test -d /tmp/aa

          echo "UGS-Assets root folders:"
          find /tmp/ugs -mindepth 1 -maxdepth 1 -type d | sed 's#^/tmp/ugs/##' | sort | head -200
          echo "Eaglercraft Extras root folders:"
          find /tmp/eaglercraft-extras -mindepth 1 -maxdepth 1 -type d | sed 's#^/tmp/eaglercraft-extras/##' | sort | head -200
          echo "AA Gamerz root folders:"
          find /tmp/aa -mindepth 1 -maxdepth 1 -type d | sed 's#^/tmp/aa/##' | sort | head -200

      - name: Import every usable GitHub game file collection
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/import_games.py /tmp/ugs /tmp/eaglercraft-extras /tmp/aa
          test -d games
          folders=$(find games -mindepth 1 -maxdepth 1 -type d | wc -l)
          indexes=$(find games -mindepth 2 -maxdepth 2 -name index.html -type f | wc -l)
          echo "Total game folders including AI Originals: $folders"
          echo "Total playable entry points including AI Originals: $indexes"
          test "$folders" -gt 0
          test "$indexes" -gt 0
          test -s games.json
          test -s CREDITS.md

      - name: Commit the actual local game files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Aither Gaming Importer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A games games.json CREDITS.md
          if git diff --cached --quiet; then
            echo "No game changes to commit."
            exit 0
          fi
          git diff --cached --stat
          git commit -m "Import all usable GitHub game files [skip ci]"

          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo "Game import pushed successfully."
              exit 0
            fi
            echo "Push/rebase attempt $attempt failed; retrying from a clean sync..."
            git rebase --abort 2>/dev/null || true
            git reset --hard HEAD
          done

          echo "Unable to push the imported games after 3 attempts."
          exit 1
