name: Import Aither Gaming

# TEMPORARY: GitHub-only game import. Source files are downloaded through jsDelivr.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-games.yml'
      - 'scripts/import_games.py'

permissions:
  contents: write

concurrency:
  group: aither-gaming-import
  cancel-in-progress: false

jobs:
  import-games:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout Aither Gaming
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Sync checkout before generating imports
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          git clean -fd

      - name: Download all temporary GitHub game collections through jsDelivr
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/game-sources
          mkdir -p /tmp/game-sources

          download_repo() {
            local repo="$1"
            local destination="$2"
            local branch="${3:-main}"
            local manifest="/tmp/${destination##*/}-jsdelivr.json"
            local base="https://cdn.jsdelivr.net/gh/${repo}@${branch}"

            echo "Getting jsDelivr file manifest for ${repo}@${branch}..."
            for attempt in 1 2 3 4 5; do
              if curl -fsSL --retry 3 --retry-delay 2 "https://data.jsdelivr.com/v1/package/gh/${repo}@${branch}" -o "$manifest"; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "Unable to get jsDelivr manifest for ${repo}@${branch}."
                return 1
              fi
              sleep $((attempt * 10))
            done

            mkdir -p "$destination"
            python3 - "$manifest" "$base" "$destination" <<'PY'
import json
import os
import subprocess
import sys

manifest_path, base, destination = sys.argv[1:]
data = json.load(open(manifest_path, encoding="utf-8"))
files = []

def walk(node, prefix=""):
    if isinstance(node, dict):
        name = node.get("name", "")
        path = f"{prefix}/{name}" if prefix and name else (name or prefix)
        if node.get("type") == "file":
            files.append(path.lstrip("/"))
        for child in node.get("files", []) or []:
            walk(child, path)
    elif isinstance(node, list):
        for child in node:
            walk(child, prefix)

walk(data.get("files", []))

# Never import repository Git metadata through the CDN.
files = [p for p in files if not any(part in {".git", ".github"} for part in p.split("/"))]
print(f"jsDelivr reports {len(files)} files")

for rel in files:
    target = os.path.join(destination, rel)
    os.makedirs(os.path.dirname(target), exist_ok=True)
    url = base + "/" + "/".join(subprocess.run(["python3", "-c", "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe='/@'))", rel], capture_output=True, text=True, check=True).stdout.strip().splitlines()[-1:]) if False else None
    import urllib.parse
    url = base + "/" + urllib.parse.quote(rel, safe="/@-_.~()")
    subprocess.run([
        "curl", "-fsSL", "--retry", "4", "--retry-delay", "2", "--connect-timeout", "20", "--max-time", "300", url, "-o", target
    ], check=True)
PY
          }

          download_repo bubbls/UGS-Assets /tmp/game-sources/ugs main
          download_repo x8rr/Eaglercraft-Extras /tmp/game-sources/eaglercraft-extras main
          download_repo aa-gamerz22/aa-gamerz-games /tmp/game-sources/aa main
          download_repo Shrimpy-com/Shrimpy-Game-Box /tmp/game-sources/shrimpy-game-box main
          download_repo mariohd/JSGames /tmp/game-sources/jsgames main
          download_repo Rysm/html-minigames /tmp/game-sources/html-minigames main
          download_repo stphung/classic-games-collection /tmp/game-sources/classic-games-collection main

      - name: Import every usable game
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            echo "jsDelivr game import attempt $attempt/5..."
            if python3 scripts/import_games.py /tmp/game-sources/ugs /tmp/game-sources/eaglercraft-extras /tmp/game-sources/aa /tmp/game-sources/shrimpy-game-box /tmp/game-sources/jsgames /tmp/game-sources/html-minigames /tmp/game-sources/classic-games-collection; then
              test -d games
              folders=$(find games -mindepth 1 -maxdepth 1 -type d | wc -l)
              entries=$(python3 -c 'import json; print(sum(1 for g in json.load(open("games.json", encoding="utf-8")) if g.get("entry")))')
              files=$(find games -type f | wc -l)
              echo "Total game folders including AI Originals: $folders"
              echo "Total playable entry points including AI Originals: $entries"
              echo "Total game files including assets: $files"
              test "$folders" -gt 0
              test "$entries" -gt 0
              test "$files" -ge "$entries"
              test -s games.json
              test -s CREDITS.md
              if grep -q 'UGS Google Drive' games.json; then
                echo "ERROR: Google Drive games were imported during the temporary GitHub-only run."
                exit 1
              fi
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then sleep $((attempt * 10)); fi
          done
          echo "jsDelivr game import failed after 5 attempts."
          exit 1

      - name: Verify files are safe for GitHub
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            echo "GitHub safety verification attempt $attempt/5..."
            bad=0
            while IFS= read -r -d '' file; do
              size=$(stat -c '%s' "$file")
              if [ "$size" -ge 100000000 ]; then
                echo "ERROR: file is too large for GitHub: $file ($size bytes)"
                bad=1
              fi
            done < <(find games -type f -print0)
            if [ "$bad" -eq 0 ]; then
              echo "All imported files are below GitHub's per-file limit."
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then sleep $((attempt * 10)); fi
          done
          echo "GitHub safety verification failed after 5 attempts."
          exit 1

      - name: Commit and push imported game files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Aither Gaming Importer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.compression 0
          git config http.version HTTP/1.1

          echo "Removing stale nested Git metadata..."
          find games -type d -name .git -prune -exec rm -rf {} + 2>/dev/null || true
          find games -type f \( -name .gitmodules -o -name .gitignore -o -name .gitattributes \) -delete 2>/dev/null || true

          git rm -r --cached --ignore-unmatch games >/dev/null 2>&1 || true
          git add -A -f games games.json CREDITS.md
          git status --short

          staged_games=$(git diff --cached --name-only -- games | wc -l)
          working_games=$(find games -type f | wc -l)
          echo "Game files on disk: $working_games"
          echo "Game files staged for Git: $staged_games"

          if [ "$staged_games" -lt "$working_games" ]; then
            echo "ERROR: not every game file was staged."
            git status --short --untracked-files=all -- games
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "No game changes to commit."
            exit 0
          fi

          if git diff --cached --raw | grep -q '160000'; then
            echo "ERROR: a nested Git submodule entry is still staged."
            git diff --cached --raw | grep '160000' || true
            exit 1
          fi

          echo "Staged file count: $(git diff --cached --name-only | wc -l)"
          git commit --no-verify -m "Import complete game files through jsDelivr"

          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt/5..."
            git fetch origin main

            if ! git merge-base --is-ancestor origin/main HEAD; then
              echo "main changed while the import was running. Preparing a clean rebase."
              if [ -n "$(git status --porcelain)" ]; then
                git stash push --include-untracked --message "aither-import-safety-stash-$attempt"
                STASHED=1
              else
                STASHED=0
              fi
              if ! git rebase origin/main; then
                git rebase --abort || true
                if [ "$STASHED" -eq 1 ]; then git stash pop || true; fi
                sleep $((attempt * 10))
                continue
              fi
              if [ "$STASHED" -eq 1 ]; then git stash pop || exit 1; fi
            fi

            if [ -n "$(git status --porcelain)" ]; then
              echo "ERROR: working tree is dirty before push:"
              git status --short
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Complete jsDelivr game import pushed successfully."
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then sleep $((attempt * 10)); fi
          done

          echo "Unable to push imported games after 5 attempts."
          exit 1
