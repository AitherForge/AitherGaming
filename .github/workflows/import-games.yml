name: Import Aither Gaming

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import-games:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Aither Gaming
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone supplied game collections
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/aa /tmp/ugs
          git clone --depth 1 https://github.com/aa-gamerz22/aa-gamerz-games.git /tmp/aa
          git clone --depth 1 https://github.com/bubbls/UGS-Assets.git /tmp/ugs

      - name: Copy 100 real games into games/
        shell: bash
        run: |
          set -euxo pipefail
          python3 scripts/import_games.py /tmp/aa /tmp/ugs
          test -d games
          test "$(find games -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 100
          test "$(find games -mindepth 2 -maxdepth 2 -name index.html -type f | wc -l)" -eq 100

      - name: Commit the actual local game files
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "Aither Gaming Importer"
          git config user.email "actions@users.noreply.github.com"
          git add -A games games.json app.js CREDITS.md README.md index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add 100 local game source folders"
          git push
